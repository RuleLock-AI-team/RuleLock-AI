name: RuleLock CI (nested checkout)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deployed-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm checkout root
        run: git rev-parse --show-toplevel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: data-collection
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest
      - name: Lint deployed backend
        working-directory: data-collection
        run: ruff check .
      - name: Test deployed backend
        working-directory: data-collection
        run: pytest -q

  legacy-modules:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        module: [rule-engine, anomaly-detection, enforcement-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest
      - name: Lint legacy module
        working-directory: ${{ matrix.module }}
        run: ruff check .
      - name: Test legacy module
        working-directory: ${{ matrix.module }}
        run: pytest -q
