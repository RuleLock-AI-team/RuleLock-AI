version: "3.9"
# Only the deployed Flask backend is a service. The three root-level engine
# directories are retained legacy copies and are not deployed.
services:
  data-collection:
    build: ./data-collection
    ports:
      - "5001:5001"
    environment:
      APP_ENV: ${APP_ENV:-production}
      RULELOCK_ALLOW_NO_AUTH: ${RULELOCK_ALLOW_NO_AUTH:-0}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      RULELOCK_API_TOKEN: ${RULELOCK_API_TOKEN}
      ANOMALY_HOLD_THRESHOLD: ${ANOMALY_HOLD_THRESHOLD:--0.06}
      ANOMALY_REJECT_THRESHOLD: ${ANOMALY_REJECT_THRESHOLD:--0.1}
