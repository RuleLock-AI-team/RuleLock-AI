version: "3.9"
# rule-engine, anomaly-detection, and enforcement-engine now run in-process
# inside data-collection (see data-collection/rules.py, anomaly_scoring.py,
# decision.py). The original service folders still exist with their own
# Dockerfiles/tests, but they're no longer part of the deployed backend.
services:
  data-collection:
    build: ./data-collection
    ports:
      - "5001:5001"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      RULELOCK_API_TOKEN: ${RULELOCK_API_TOKEN}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:--0.06}