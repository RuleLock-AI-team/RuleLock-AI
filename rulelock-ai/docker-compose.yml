version: "3.9"
services:
  data-collection:
    build: ./data-collection
    ports:
      - "5001:5001"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}

  rule-engine:
    build: ./rule-engine
    ports:
      - "5002:5002"

  anomaly-detection:
    build: ./anomaly-detection
    ports:
      - "5003:5003"

  enforcement-engine:
    build: ./enforcement-engine
    ports:
      - "5004:5004"
