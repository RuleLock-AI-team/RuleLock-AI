services:
  - type: web
    name: rulelock-data-collection
    runtime: docker
    region: singapore
    plan: free
    rootDir: rulelock-ai/data-collection
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RULELOCK_API_TOKEN
        sync: false
      - key: CAKELY_ORIGINS
        value: https://charukagimhan2020-hub.github.io,https://nimble-blancmange-3cb45c.netlify.app
      - key: ANOMALY_THRESHOLD
        value: "-0.06"
