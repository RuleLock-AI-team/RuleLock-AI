<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RuleLock AI</title>
    <script>
      // Preserve hash routing when GitHub Pages receives a direct route request.
      const path = window.location.pathname;
      const base = path.slice(0, path.lastIndexOf("/") + 1);
      window.location.replace(`${base}index.html${window.location.search}${window.location.hash}`);
    </script>
  </head>
  <body>
    <p>Loading RuleLock AI...</p>
  </body>
</html>
