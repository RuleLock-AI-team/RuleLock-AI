[build]
  command = "node build-static.js"
  publish = "public"

[[redirects]]
  from = "/dev-server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/*"
  to = "/404.html"
  status = 404
  force = true

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/attack-simulation"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/audit-log"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pipeline"
  to = "/index.html"
  status = 200
