name: Deploy RuleLock frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "rulelock-ai/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static frontend
        working-directory: rulelock-ai/frontend
        run: node build-static.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rulelock-ai/frontend/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
